server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: inventory-service
          uri: http://inventory-service:8080
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true